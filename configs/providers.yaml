default_provider: codex
providers:
  codex:
    command: codex
    args:
      [
        "exec",
        "--ephemeral",
        "--skip-git-repo-check",
        "-m",
        "gpt-5.6-sol",
        "-c",
        "model_reasoning_effort=\"medium\"",
      ]
    protocol: codex_exec
    # Keep the account-level request gate aligned with the 50-case batch worker.
    max_concurrent_calls: 50
    transient_attempts: 4
    transient_backoff_s: 10
  claude_code:
    command: claude
    args: ["--print", "--output-format", "json"]
    protocol: claude_code
