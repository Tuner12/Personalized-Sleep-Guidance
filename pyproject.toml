[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sleepguide"
version = "1.0.0"
description = "Evidence-grounded personalized sleep guidance from wearable data (ML4H 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.10,<2",
  "datasets>=4.8,<5",
  "torch>=2.6,<3",
  "transformers>=5.2,<6",
  "trl>=1.9,<2",
]
eval = [
  "bert-score>=0.3.13",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sleepguide"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "baselines"]

[tool.ruff]
line-length = 100
target-version = "py311"
